{% load static %}
<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="{% static 'css/neat.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %} &mdash; Pondermore</title>
</head>

<body>
  <header>
    <a href="{% url 'home' %}" class="home">P</a>
    <nav>
      <ul class="inline">
        {% if user.is_authenticated %}
          <li><a href="{% url 'ponderings:pondering-index' %}">Ponderings</a></li>
          <li>
            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <button class="logout" type="submit">Logout</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Login</a></li>
          <li><a href="{% url 'signup' %}">Sign Up</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>

  <hr>

  <main>
      {% block content %}
      {% endblock %}
  </main>
</body>

</html>
