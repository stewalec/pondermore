{% extends "base.html" %}

{% block title %}Ponderings{% endblock %}

{% block content %}
    <div class="centered">
        <form method="post">
            {% csrf_token %}
            <p>Are you sure you want to delete the following pondering?</p>
            <p>{{ object }}</p>
            {{ form }}
            <button type="submit">Delete</button>
            <a class="button" href="{% url 'ponderings:pondering-edit' pondering.id %}">Cancel</a>
        </form>
    </div>
{% endblock %}
