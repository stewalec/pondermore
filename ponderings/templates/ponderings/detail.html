{% extends "base.html" %}

{% block title %}Ponderings{% endblock %}

{% block content %}
    <div class="pondering">
        <blockquote>
            <p>"{{ pondering.content }}"</p>
            <p class="author">— {{ pondering.author }}{% if pondering.reference %}, <cite>{{ pondering.reference }}</cite>{% endif %}</p>
        </blockquote>
    </div>
{% endblock %}
