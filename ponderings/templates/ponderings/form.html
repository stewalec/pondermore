{% extends "base.html" %}

{% block title %}Ponderings{% endblock %}

{% block content %}
    <div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
            <a class="button" href="{% url 'ponderings:pondering-index' %}">Cancel</a>
            {% if form.instance.id %}
                <a class="button" href="{% url 'ponderings:pondering-delete' form.instance.id %}">Delete</a>
            {% endif %}
        </form>
    </div>
{% endblock %}
